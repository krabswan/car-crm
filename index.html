<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蟹老板车险管家 v2.9</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563eb;--teal:#0891b2;--orange:#f59e0b;--green:#10b981;--red:#ef4444;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--light:#64748b;--yellow:#fbbf24}
body{font-family:'Noto Sans SC',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(37,99,235,0.3)}
.header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(16,185,129,0.15);color:#34d399;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.dot{width:8px;height:8px;background:#34d399;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px}
.stat{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.08)}
.stat .lbl{font-size:12px;color:var(--light);margin-bottom:6px}
.stat .val{font-size:26px;font-weight:700}
.stat.blue{border-left:4px solid var(--blue)}.stat.blue .val{color:var(--blue)}
.stat.orange{border-left:4px solid var(--orange)}.stat.orange .val{color:var(--orange)}
.stat.green{border-left:4px solid var(--green)}.stat.green .val{color:var(--green)}
.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex}
.tab{padding:16px 24px;font-size:14px;color:var(--light);cursor:pointer;border-bottom:3px solid transparent;font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--blue)}
.tab.active{color:var(--blue);border-color:var(--blue);font-weight:700}
.content{padding:24px;max-width:1200px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.qa{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-blue{background:var(--blue);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-white{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-outline{border:1.5px solid var(--border);background:transparent;color:var(--text)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:6px}
.search-bar{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-bar input{flex:1;min-width:180px;padding:10px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;transition:border-color .2s}
.search-bar input:focus{outline:none;border-color:var(--blue)}
.record{background:var(--card);border-radius:16px;padding:18px 20px;border:1px solid var(--border);transition:all .2s;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px}
.record:hover{border-color:var(--blue);box-shadow:0 4px 20px rgba(37,99,235,.1)}
.record.nc{border-left:4px solid var(--teal)}
.record.nc:hover{border-color:var(--teal);box-shadow:0 4px 20px rgba(8,145,178,.1)}
.record.red-zone{border-left:4px solid var(--red);background:#fef2f2}
.record.orange-zone{border-left:4px solid var(--orange);background:#fffbeb}
.record input[type="checkbox"]{width:18px;height:18px;cursor:pointer;margin-top:2px;flex-shrink:0}
.record-main{flex:1;min-width:0}
.record-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.record h4{font-size:15px;font-weight:700}
.record .meta{display:flex;gap:16px;font-size:13px;color:var(--light);flex-wrap:wrap}
.record .meta span{display:flex;align-items:center;gap:4px}
.tag{display:inline-block;background:#eff6ff;color:var(--blue);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag.teal{background:#ecfeff;color:var(--teal)}
.tag.red{background:#fef2f2;color:var(--red)}
.tag.orange{background:#fffbeb;color:var(--orange)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.batch-bar{background:#fff8e1;border:1px solid var(--yellow);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
.batch-bar.show{display:flex}
.batch-bar span{font-size:13px;color:#92400e;font-weight:600}
.chk{width:18px;height:18px;cursor:pointer}
.mo{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center}
.mo.active{display:flex}
.mc{background:var(--card);border-radius:20px;width:95%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.2);animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}}
.mh{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.mh.blue{background:linear-gradient(135deg,#dbeafe,#eff6ff);color:var(--blue);border-radius:20px 20px 0 0}
.mh.teal{background:linear-gradient(135deg,#cffafe,#ecfeff);color:var(--teal);border-radius:20px 20px 0 0}
.mh h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.mcl{width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.06);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.mcl:hover{background:rgba(0,0,0,.12)}
.mb{padding:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;color:var(--light);margin-bottom:6px;font-weight:600}
.fg input,.fg select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fg .hl{background:linear-gradient(135deg,#dbeafe,#eff6ff);border-color:var(--blue);font-weight:700;color:var(--blue)}
.fg .teal-hl{background:linear-gradient(135deg,#cffafe,#ecfeff);border-color:var(--teal);font-weight:700;color:var(--teal)}
.fg .total{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mf{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 25px rgba(16,185,129,.4);z-index:2000;animation:tIn .3s;display:none;align-items:center;gap:8px}
.toast.e{background:var(--red);box-shadow:0 8px 25px rgba(239,68,68,.4)}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}
.empty{text-align:center;padding:50px 20px;color:var(--light)}
.empty .icon{font-size:48px;margin-bottom:16px;opacity:.4}
.ds{background:var(--card);border-radius:16px;padding:24px;border:1px solid var(--border);margin-bottom:20px}
.ds h4{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ds p{color:var(--light);font-size:13px;margin-bottom:12px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sh h3{font-size:16px;font-weight:700}
.g{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.reminder{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);margin-bottom:20px}
.reminder h4{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.reminder-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.reminder-item:last-child{border-bottom:none}
.reminder-item .icon{font-size:20px}
.reminder-item .info{flex:1;min-width:0}
.reminder-item .name{font-weight:600;font-size:14px}
.reminder-item .detail{font-size:12px;color:var(--light)}
.reminder-item .days{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px}
.days.red{background:#fef2f2;color:var(--red)}
.days.orange{background:#fffbeb;color:var(--orange)}
.days.green{background:#ecfdf5;color:var(--green)}
.reminder-empty{text-align:center;padding:20px;color:var(--light);font-size:13px}
.select-all{margin-right:4px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.header h1{font-size:16px}}
</style>
</head>
<body>
<div class="header">
<h1>🚗 蟹老板车险管家 <span class="badge"><span class="dot"></span> 云端已连接</span></h1>
</div>
<div class="stats">
<div class="stat blue"><div class="lbl">📋 客户总数</div><div class="val" id="sT">0</div></div>
<div class="stat"><div class="lbl">🚗 车险总保费</div><div class="val" id="sC">¥0</div></div>
<div class="stat orange"><div class="lbl">🛡️ 非车险总保费</div><div class="val" id="sN">¥0</div></div>
<div class="stat green"><div class="lbl">💰 总佣金</div><div class="val" id="sO">¥0</div></div>
</div>
<div class="tabs">
<div class="tab active" data-t="home" onclick="switchTab('home')">📊 工作台</div>
<div class="tab" data-t="car" onclick="switchTab('car')">🚗 车险</div>
<div class="tab" data-t="nc" onclick="switchTab('nc')">🛡️ 非车险</div>
<div class="tab" data-t="data" onclick="switchTab('data')">💾 数据</div>
</div>
<div class="content">
<div class="panel active" id="homePanel">
<div class="qa">
<button class="btn btn-blue" onclick="goTab('car');setTimeout(openCar,100)">➕ 新增车险</button>
<button class="btn btn-teal" onclick="goTab('nc');setTimeout(openNc,100)">➕ 新增非车险</button>
</div>
<div id="homeList"></div>
</div>
<div class="panel" id="carPanel">
<div class="batch-bar" id="carBatchBar">
<input type="checkbox" class="chk" id="carSelectAll" onchange="toggleCarAll(this)">
<span>已选 <b id="carSelCount">0</b> 条</span>
<button class="btn btn-red btn-sm" onclick="delCarSelected()">🗑️ 批量删除</button>
<button class="btn btn-white btn-sm" onclick="clearCarSelection()">取消选择</button>
</div>
<div class="search-bar">
<input type="text" id="carSearch" placeholder="搜索客户姓名或车牌..." oninput="renderCar()">
<button class="btn btn-blue" onclick="openCar()">➕ 新增车险</button>
</div>
<div id="carList"></div>
</div>
<div class="panel" id="ncPanel">
<div class="batch-bar" id="ncBatchBar">
<input type="checkbox" class="chk" id="ncSelectAll" onchange="toggleNcAll(this)">
<span>已选 <b id="ncSelCount">0</b> 条</span>
<button class="btn btn-red btn-sm" onclick="delNcSelected()">🗑️ 批量删除</button>
<button class="btn btn-white btn-sm" onclick="clearNcSelection()">取消选择</button>
</div>
<div class="search-bar">
<input type="text" id="ncSearch" placeholder="搜索客户姓名..." oninput="renderNc()">
<button class="btn btn-teal" onclick="openNc()">➕ 新增非车险</button>
</div>
<div id="ncList"></div>
</div>
<div class="panel" id="dataPanel">
<div class="sh"><h3>💾 数据管理</h3></div>
<div class="ds">
<h4>📤 导出数据</h4>
<div class="btn-group">
<button class="btn btn-blue" onclick="expAll()">📥 导出全部</button>
<button class="btn btn-outline" onclick="expCar()">🚗 仅车险</button>
<button class="btn btn-outline" onclick="expNc()">🛡️ 仅非车险</button>
<button class="btn btn-green" onclick="expExcel()">📊 导出Excel</button>
</div>
</div>
<div class="ds">
<h4>📥 导入数据</h4>
<p>从备份文件导入（JSON格式）</p>
<input type="file" id="impFile" accept=".json" onchange="doImport(this)" style="font-size:14px">
<div id="impInfo" style="margin-top:10px"></div>
</div>
<div class="ds">
<h4 style="color:var(--red)">⚠️ 危险操作</h4>
<button class="btn btn-red" onclick="doClear()">🗑️ 清空全部数据</button>
</div>
</div>
</div>
<div class="mo" id="carModal">
<div class="mc">
<div class="mh blue"><h3>🚗 新增/编辑车险</h3><button class="mcl" onclick="closeCar()">×</button></div>
<div class="mb">
<input type="hidden" id="carEid">
<div class="g g2">
<div class="fg"><label>客户姓名 <b style="color:red">*</b></label><input type="text" id="carName" placeholder="输入客户姓名"></div>
<div class="fg"><label>电话</label><input type="tel" id="carPhone" placeholder="手机号码"></div>
<div class="fg"><label>车牌号 <b style="color:red">*</b></label><input type="text" id="carPlate" placeholder="如：苏D12345"></div>
<div class="fg"><label>车架号</label><input type="text" id="carVin" placeholder="17位车架号"></div>
<div class="fg"><label>车辆品牌</label><input type="text" id="carBrand" placeholder="如：大众"></div>
<div class="fg"><label>车型</label><input type="text" id="carModel" placeholder="如：帕萨特"></div>
<div class="fg"><label>保险公司</label>
<select id="carCo"><option>中国人保</option><option>中国平安</option><option>中国太保</option><option>阳光保险</option><option>大地保险</option><option>国寿财险</option><option>其他</option></select>
</div>
<div class="fg"><label>保单号</label><input type="text" id="carPol" placeholder="选填"></div>
<div class="fg" style="grid-column:1/-1"><label>保费明细</label>
<div class="total">
<input type="number" id="carBiz" placeholder="商业险" oninput="calcCar()">
<input type="number" id="carForce" placeholder="交强险" oninput="calcCar()">
<input type="number" id="carTax" placeholder="车船税" oninput="calcCar()">
</div>
</div>
<div class="fg"><label>总保费 <b style="color:red">*</b></label><input type="number" id="carTotal" class="hl" placeholder="自动计算" readonly></div>
<div class="fg"><label>佣金</label><input type="number" id="carCom" placeholder="0"></div>
<div class="fg"><label>签单日期</label><input type="date" id="carSign"></div>
<div class="fg"><label>起保日期 <b style="color:red">*</b></label><input type="date" id="carStart" onchange="calcEndDate('car')"></div>
<div class="fg"><label>到期日期</label><input type="date" id="carEnd" readonly style="background:#f8fafc;color:var(--light)" placeholder="自动计算（起保日期+1年）"></div>
<div class="fg" style="grid-column:1/-1"><label>备注</label><input type="text" id="carRemark" placeholder="经办人、其他备注"></div>
</div>
</div>
<div class="mf">
<button class="btn btn-white" onclick="closeCar()">取消</button>
<button class="btn btn-blue" onclick="saveCar()">💾 保存</button>
</div>
</div>
</div>
<div class="mo" id="ncModal">
<div class="mc">
<div class="mh teal"><h3>🛡️ 新增/编辑非车险</h3><button class="mcl" onclick="closeNc()">×</button></div>
<div class="mb">
<input type="hidden" id="ncEid">
<div class="g g2">
<div class="fg"><label>被保人姓名 <b style="color:red">*</b></label><input type="text" id="ncName" placeholder="输入姓名"></div>
<div class="fg"><label>电话</label><input type="tel" id="ncPhone" placeholder="手机号码"></div>
<div class="fg"><label>险种 <b style="color:red">*</b></label>
<select id="ncType"><option>驾意险</option><option>意外险</option><option>安康险</option><option>学平险</option><option>雇主责任险</option><option>其他</option></select>
</div>
<div class="fg"><label>保险公司</label>
<select id="ncCo"><option>中国人保</option><option>中国平安</option><option>中国太保</option><option>阳光保险</option><option>大地保险</option><option>国寿财险</option><option>其他</option></select>
</div>
<div class="fg"><label>保费 <b style="color:red">*</b></label><input type="number" id="ncPremium" class="teal-hl" placeholder="0"></div>
<div class="fg"><label>佣金</label><input type="number" id="ncCom" placeholder="0"></div>
<div class="fg"><label>签单日期</label><input type="date" id="ncSign"></div>
<div class="fg"><label>起保日期 <b style="color:red">*</b></label><input type="date" id="ncStart" onchange="calcEndDate('nc')"></div>
<div class="fg"><label>到期日期</label><input type="date" id="ncEnd" readonly style="background:#f8fafc;color:var(--light)" placeholder="自动计算（起保日期+1年）"></div>
<div class="fg" style="grid-column:1/-1"><label>备注</label><input type="text" id="ncRemark" placeholder="经办人、其他备注"></div>
</div>
</div>
<div class="mf">
<button class="btn btn-white" onclick="closeNc()">取消</button>
<button class="btn btn-teal" onclick="saveNc()">💾 保存</button>
</div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
var SB="https://yjnkbippailouqoqivtv.supabase.co";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqbmtiaXBwYWlsb3Vxb3FpdnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjczNjcsImV4cCI6MjA5MDg0MzM2N30.QXYd5vK6bjD8Z7UmoA7JMb0AokHpZj9SggGPUd-DqDc";
var carD=[];
var ncD=[];
var carSel={};
var ncSel={};
function $(id){return document.getElementById(id);}
function init(){var t=new Date().toISOString().split("T")[0];$("carSign").value=t;$("carStart").value="";$("carEnd").value="";$("ncSign").value=t;$("ncStart").value="";$("ncEnd").value="";loadAll();}
async function loadAll(){try{carD=await apiG("car_insurance")}catch(e){carD=[]}try{ncD=await apiG("noncar_insurance")}catch(e){ncD=[]}updateStats();renderHome();renderCar();renderNc();renderReminder();}
async function apiG(t){var r=await fetch(SB+"/rest/v1/"+t+"?select=*&order=id.desc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw new Error(r.status);return r.json();}
async function apiP(t,d){var r=await fetch(SB+"/rest/v1/"+t,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(d)});if(!r.ok){var e=await r.text();throw new Error(e);}return r.json();}
async function apiU(t,i,d){var r=await fetch(SB+"/rest/v1/"+t+"?id=eq."+i,{method:"PATCH",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(d)});if(!r.ok)throw new Error("更新失败");return r.json();}
async function apiD(t,i){var r=await fetch(SB+"/rest/v1/"+t+"?id=eq."+i,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw new Error("删除失败");}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=a[i][f]||0;return s;}
function daysUntil(dateStr){if(!dateStr)return null;var d=new Date(dateStr);var t=new Date();t.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.ceil((d-t)/(1000*60*60*24));}
function updateStats(){$("sT").textContent=carD.length+ncD.length;$("sC").textContent="¥"+sum(carD,"total_premium").toLocaleString();$("sN").textContent="¥"+sum(ncD,"premium").toLocaleString();$("sO").textContent="¥"+(sum(carD,"commission")+sum(ncD,"commission")).toLocaleString();}
function renderReminder(){var today=new Date();today.setHours(0,0,0,0);var items=[];for(var i=0;i<carD.length;i++){var r=carD[i];if(!r.end_date)continue;var d=daysUntil(r.end_date);if(d!==null&&d<=90){items.push({t:"车险",n:r.customer_name||"-",m:r.plate||"-",co:r.company||"-",d:d,id:r.id,phone:r.phone||""});}}for(var i=0;i<ncD.length;i++){var r=ncD[i];if(!r.end_date)continue;var d=daysUntil(r.end_date);if(d!==null&&d<=90){items.push({t:"非车险",n:r.insured_name||"-",m:r.insurance_type||"-",co:r.company||"-",d:d,id:r.id,phone:r.phone||"",nc:true});}}items.sort(function(a,b){return a.d-b.d;});var html="<div class=\"reminder\"><h4>🔔 续保提醒（未来90天内到期）</h4>";if(items.length===0){html+="<div class=\"reminder-empty\">✅ 近期无到期客户，续保提醒为空</div>";}else{for(var i=0;i<items.length;i++){var x=items[i];var cls=x.d<=7?"red":x.d<=30?"orange":"green";var txt=x.d<=0?"已到期":x.d===0?"今天到期":"剩余"+x.d+"天";html+="<div class=\"reminder-item\"><span class=\"icon\">"+(x.nc?"🛡️":"🚗")+"</span><div class=\"info\"><div class=\"name\">"+(x.n||"-")+" <span style=\"font-weight:400;font-size:12px;color:"+(x.nc?"var(--teal)":"var(--blue)")+"\">"+(x.m||"-")+"</span></div><div class=\"detail\">"+x.co+" | "+x.phone+"</div></div><span class=\"days "+cls+"\">"+txt+"</span></div>";}}html+="</div>";var el=$("homeList");if(carD.length===0&&ncD.length===0){el.innerHTML=html+"<div class=\"empty\"><div class=\"icon\">📋</div><p>暂无记录</p></div>";return;}el.innerHTML=html;}
function renderHome(){renderReminder();}
function renderCar(){var s=($("carSearch")||{value:""}).value.toLowerCase();var d=carD;if(s){d=[];for(var i=0;i<carD.length;i++){var r=carD[i];if((r.customer_name||"").toLowerCase().indexOf(s)>-1||(r.plate||"").toLowerCase().indexOf(s)>-1)d.push(r);}}var sel=Object.keys(carSel).length;$("carSelCount").textContent=sel;$("carBatchBar").className="batch-bar"+(sel>0?" show":"");var el=$("carList");if(d.length===0){el.innerHTML="<div class=\"empty\"><div class=\"icon\">🚗</div><p>暂无车险记录</p></div>";return;}var h="";for(var i=0;i<d.length;i++){var r=d[i];var days=d&&daysUntil(r.end_date);var cls=days!==null&&days<=0?"red-zone":days!==null&&days<=7?"orange-zone":"";var dayBadge="";if(days!==null){dayBadge=days<=0?'<span class="tag red">已到期</span>':days<=7?'<span class="tag orange">'+days+'天后</span>':days<=30?'<span class="tag" style="background:#fffbeb;color:var(--orange)">'+days+'天后</span>':"";}h+='<div class="record'+cls+'"><input type="checkbox" class="chk" id="ccb'+r.id+'" '+(carSel[r.id]?'checked ':'')+'onchange="toggleCar(\''+r.id+'\')"><div class="record-main"><div class="record-h"><h4>'+(r.customer_name||"-")+' <span class="tag">🚗 '+(r.plate||"-")+'</span>'+dayBadge+'</h4></div><div class="meta"><span>🏢 '+(r.company||"-")+'</span><span>💰 ¥'+(r.total_premium||0).toLocaleString()+'</span><span>💵 佣金 ¥'+(r.commission||0)+'</span><span>📅 到期 '+(r.end_date||"-")+'</span></div><div class="actions"><button class="btn btn-xs btn-white" onclick="editCar(\''+r.id+'\')">✏️ 编辑</button> <button class="btn btn-xs btn-red" onclick="delCar(\''+r.id+'\')">🗑️ 删除</button></div></div></div>';}el.innerHTML=h;}
function renderNc(){var s=($("ncSearch")||{value:""}).value.toLowerCase();var d=ncD;if(s){d=[];for(var i=0;i<ncD.length;i++){var r=ncD[i];if((r.insured_name||"").toLowerCase().indexOf(s)>-1)d.push(r);}}var sel=Object.keys(ncSel).length;$("ncSelCount").textContent=sel;$("ncBatchBar").className="batch-bar"+(sel>0?" show":"");var el=$("ncList");if(d.length===0){el.innerHTML="<div class=\"empty\"><div class=\"icon\">🛡️</div><p>暂非车险记录</p></div>";return;}var h="";for(var i=0;i<d.length;i++){var r=d[i];var days=daysUntil(r.end_date);var cls=days!==null&&days<=0?"red-zone":days!==null&&days<=7?"orange-zone":"";var dayBadge="";if(days!==null){dayBadge=days<=0?'<span class="tag red">已到期</span>':days<=7?'<span class="tag orange">'+days+'天后</span>':days<=30?'<span class="tag" style="background:#fffbeb;color:var(--orange)">'+days+'天后</span>':"";}h+='<div class="record nc'+cls+'"><input type="checkbox" class="chk" id="ncb'+r.id+'" '+(ncSel[r.id]?'checked ':'')+'onchange="toggleNc(\''+r.id+'\')"><div class="record-main"><div class="record-h"><h4>'+(r.insured_name||"-")+' <span class="tag teal">'+(r.insurance_type||"-")+'</span>'+dayBadge+'</h4></div><div class="meta"><span>🏢 '+(r.company||"-")+'</span><span>💰 ¥'+(r.premium||0).toLocaleString()+'</span><span>💵 佣金 ¥'+(r.commission||0)+'</span><span>📅 到期 '+(r.end_date||"-")+'</span></div><div class="actions"><button class="btn btn-xs btn-white" onclick="editNc(\''+r.id+'\')">✏️ 编辑</button> <button class="btn btn-xs btn-red" onclick="delNc(\''+r.id+'\')">🗑️ 删除</button></div></div></div>';}el.innerHTML=h;}
function switchTab(n){var ts=document.getElementsByClassName("tab");for(var i=0;i<ts.length;i++)ts[i].classList.remove("active");var ps=document.getElementsByClassName("panel");for(var i=0;i<ps.length;i++)ps[i].classList.remove("active");for(var i=0;i<ts.length;i++){if(ts[i].getAttribute("data-t")===n){ts[i].classList.add("active");break;}}$(n+"Panel").classList.add("active");}
function goTab(n){switchTab(n);}
function toggleCar(id){if(carSel[id])delete carSel[id];else carSel[id]=true;renderCar();}
function toggleCarAll(el){var checked=el.checked;for(var i=0;i<carD.length;i++){if(checked)carSel[carD[i].id]=true;else delete carSel[carD[i].id];}renderCar();}
function toggleNc(id){if(ncSel[id])delete ncSel[id];else ncSel[id]=true;renderNc();}
function toggleNcAll(el){var checked=el.checked;for(var i=0;i<ncD.length;i++){if(checked)ncSel[ncD[i].id]=true;else delete ncSel[ncD[i].id];}renderNc();}
function clearCarSelection(){carSel={};renderCar();}
function clearNcSelection(){ncSel={};renderNc();}
async function delCarSelected(){var ids=Object.keys(carSel);if(ids.length===0)return;if(!confirm("确定删除选中的 "+ids.length+" 条车险记录？"))return;try{var failed=[];for(var i=0;i<ids.length;i++){try{await apiD("car_insurance",ids[i]);}catch(e){failed.push(ids[i]);}}if(failed.length>0){msg("部分删除失败："+failed.length+"条",1);}else{msg("批量删除成功："+ids.length+"条");}carSel={};await loadAll();}catch(e){msg("批量删除失败",1);}}
async function delNcSelected(){var ids=Object.keys(ncSel);if(ids.length===0)return;if(!confirm("确定删除选中的 "+ids.length+" 条非车险记录？"))return;try{var failed=[];for(var i=0;i<ids.length;i++){try{await apiD("noncar_insurance",ids[i]);}catch(e){failed.push(ids[i]);}}if(failed.length>0){msg("部分删除失败："+failed.length+"条",1);}else{msg("批量删除成功："+ids.length+"条");}ncSel={};await loadAll();}catch(e){msg("批量删除失败",1);}}
function openCar(){$("carEid").value="";var ids=["carName","carPhone","carPlate","carVin","carBrand","carModel","carPol","carBiz","carForce","carTax","carTotal","carCom","carRemark"];for(var i=0;i<ids.length;i++)$(ids[i]).value="";$("carCo").value="中国人保";var t=new Date().toISOString().split("T")[0];$("carSign").value=t;$("carStart").value="";$("carEnd").value="";$("carTotal").readOnly=true;$("carModal").classList.add("active");}
function closeCar(){$("carModal").classList.remove("active");}
function openNc(){$("ncEid").value="";var ids=["ncName","ncPhone","ncPremium","ncCom","ncRemark"];for(var i=0;i<ids.length;i++)$(ids[i]).value="";$("ncType").value="驾意险";$("ncCo").value="中国人保";var t=new Date().toISOString().split("T")[0];$("ncSign").value=t;$("ncStart").value="";$("ncEnd").value="";$("ncModal").classList.add("active");}
function closeNc(){$("ncModal").classList.remove("active");}
function calcCar(){var b=parseFloat($("carBiz").value)||0;var f=parseFloat($("carForce").value)||0;var tx=parseFloat($("carTax").value)||0;$("carTotal").value=b+f+tx;}
function calcEndDate(prefix){var start=$(prefix+"Start").value;if(!start)return;var d=new Date(start);d.setFullYear(d.getFullYear()+1);d.setDate(d.getDate()-1);$(prefix+"End").value=d.toISOString().split("T")[0];}
function editCar(id){var r=null;for(var i=0;i<carD.length;i++){if(carD[i].id==id){r=carD[i];break;}}if(!r)return;$("carEid").value=r.id;$("carName").value=r.customer_name||"";$("carPhone").value=r.phone||"";$("carPlate").value=r.plate||"";$("carVin").value=r.vin||"";$("carBrand").value=r.brand||"";$("carModel").value=r.car_model||"";$("carCo").value=r.company||"中国人保";$("carPol").value=r.policy_no||"";$("carBiz").value=r.biz_premium||"";$("carForce").value=r.force_premium||"";$("carTax").value=r.tax_premium||"";$("carTotal").value=r.total_premium||"";$("carCom").value=r.commission||"";$("carSign").value=r.sign_date||"";$("carStart").value=r.start_date||"";$("carEnd").value=r.end_date||"";$("carRemark").value=r.remark||"";$("carTotal").readOnly=true;$("carModal").classList.add("active");}
function editNc(id){var r=null;for(var i=0;i<ncD.length;i++){if(ncD[i].id==id){r=ncD[i];break;}}if(!r)return;$("ncEid").value=r.id;$("ncName").value=r.insured_name||"";$("ncPhone").value=r.phone||"";$("ncType").value=r.insurance_type||"驾意险";$("ncCo").value=r.company||"中国人保";$("ncPremium").value=r.premium||"";$("ncCom").value=r.commission||"";$("ncSign").value=r.sign_date||"";$("ncStart").value=r.start_date||"";$("ncEnd").value=r.end_date||"";$("ncRemark").value=r.remark||"";$("ncModal").classList.add("active");}
async function saveCar(){var n=$("carName").value.trim();var p=$("carPlate").value.trim();var t=parseFloat($("carTotal").value)||0;var start=$("carStart").value;var end=$("carEnd").value;if(!n){msg("请输入客户姓名",1);return;}if(!p){msg("请输入车牌号",1);return;}if(!t){msg("请输入总保费",1);return;}if(!start){msg("请选择起保日期",1);return;}if(!end){msg("请选择到期日期",1);return;}var d={customer_name:n,phone:$("carPhone").value.trim()||null,plate:p,vin:$("carVin").value.trim()||null,brand:$("carBrand").value.trim()||null,car_model:$("carModel").value.trim()||null,company:$("carCo").value,policy_no:$("carPol").value.trim()||null,biz_premium:parseFloat($("carBiz").value)||0,force_premium:parseFloat($("carForce").value)||0,tax_premium:parseFloat($("carTax").value)||0,total_premium:t,commission:parseFloat($("carCom").value)||0,sign_date:$("carSign").value||null,start_date:start,end_date:end,remark:$("carRemark").value.trim()||null};try{var eid=$("carEid").value;if(eid){await apiU("car_insurance",eid,d);msg("车险更新成功");}else{await apiP("car_insurance",d);msg("车险保存成功");}closeCar();await loadAll();}catch(err){msg("保存失败:"+err.message,1);}}
async function saveNc(){var n=$("ncName").value.trim();var pm=parseFloat($("ncPremium").value)||0;var start=$("ncStart").value;var end=$("ncEnd").value;if(!n){msg("请输入被保人姓名",1);return;}if(!pm){msg("请输入保费",1);return;}if(!start){msg("请选择起保日期",1);return;}if(!end){msg("请选择到期日期",1);return;}var d={insured_name:n,phone:$("ncPhone").value.trim()||null,insurance_type:$("ncType").value,company:$("ncCo").value,premium:pm,commission:parseFloat($("ncCom").value)||0,sign_date:$("ncSign").value||null,start_date:start,end_date:end,remark:$("ncRemark").value.trim()||null};try{var eid=$("ncEid").value;if(eid){await apiU("noncar_insurance",eid,d);msg("非车险更新成功");}else{await apiP("noncar_insurance",d);msg("非车险保存成功");}closeNc();await loadAll();}catch(err){msg("保存失败:"+err.message,1);}}
async function delCar(id){if(!confirm("确定删除这条车险记录？"))return;try{await apiD("car_insurance",id);msg("删除成功");delete carSel[id];await loadAll();}catch(err){msg("删除失败",1);}}
async function delNc(id){if(!confirm("确定删除这条非车险记录？"))return;try{await apiD("noncar_insurance",id);msg("删除成功");delete ncSel[id];await loadAll();}catch(err){msg("删除失败",1);}}
function msg(m,e){var t=$("toast");t.textContent=m;t.className="toast"+(e?" e":"");t.style.display="flex";setTimeout(function(){t.style.display="none";},3000);}
function down(content,filename,type){var blob=new Blob([content],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}
function expAll(){var d={car_insurance:carD,noncar_insurance:ncD,exportTime:new Date().toLocaleString(),version:"2.9"};down(JSON.stringify(d,null,2),"蟹老板保险数据_"+new Date().toISOString().split("T")[0]+".json","application/json");msg("导出成功");}
function expCar(){down(JSON.stringify({car_insurance:carD,exportTime:new Date().toLocaleString()},null,2),"车险数据_"+new Date().toISOString().split("T")[0]+".json","application/json");msg("车险导出成功");}
function expNc(){down(JSON.stringify({noncar_insurance:ncD,exportTime:new Date().toLocaleString()},null,2),"非车险数据_"+new Date().toISOString().split("T")[0]+".json","application/json");msg("非车险导出成功");}
function expExcel(){var csv="\uFEFF客户,电话,车牌,车架号,品牌,车型,公司,商业险,交强险,车船税,总保费,佣金,起保日期,到期日期,备注\n";for(var i=0;i<carD.length;i++){var r=carD[i];csv+=(r.customer_name||"")+","+(r.phone||"")+","+(r.plate||"")+","+(r.vin||"")+","+(r.brand||"")+","+(r.car_model||"")+","+(r.company||"")+","+(r.biz_premium||0)+","+(r.force_premium||0)+","+(r.tax_premium||0)+","+(r.total_premium||0)+","+(r.commission||0)+","+(r.start_date||"")+","+(r.end_date||"")+","+(r.remark||"")+"\n";}csv+="\n非车险\n被保人,电话,险种,公司,保费,佣金,起保日期,到期日期,备注\n";for(var i=0;i<ncD.length;i++){var r=ncD[i];csv+=(r.insured_name||"")+","+(r.phone||"")+","+(r.insurance_type||"")+","+(r.company||"")+","+(r.premium||0)+","+(r.commission||0)+","+(r.start_date||"")+","+(r.end_date||"")+","+(r.remark||"")+"\n";}down(csv,"蟹老板保险数据_"+new Date().toISOString().split("T")[0]+".csv","text/csv;charset=utf-8");msg("Excel导出成功");}
async function doImport(input){var file=input.files[0];if(!file)return;try{var text=await file.text();var data=JSON.parse(text);var c=0,n=0;if(data.car_insurance&&Array.isArray(data.car_insurance)){for(var i=0;i<data.car_insurance.length;i++){var r=JSON.parse(JSON.stringify(data.car_insurance[i]));delete r.id;delete r.created_at;await apiP("car_insurance",r);c++;}}if(data.noncar_insurance&&Array.isArray(data.noncar_insurance)){for(var i=0;i<data.noncar_insurance.length;i++){var r=JSON.parse(JSON.stringify(data.noncar_insurance[i]));delete r.id;delete r.created_at;await apiP("noncar_insurance",r);n++;}}$("impInfo").innerHTML="<b style='color:var(--green)'>✓ 导入完成：车险"+c+"条 非车险"+n+"条</b>";msg("导入成功");await loadAll();}catch(e){$("impInfo").innerHTML="<b style='color:var(--red)'>导入失败</b>";msg("导入失败",1);}input.value="";}
async function doClear(){if(!confirm("警告！清空后数据无法恢复，确定要清空吗？"))return;if(!confirm("最后一次确认！全部数据将被永久删除！"))return;try{for(var i=0;i<carD.length;i++)await apiD("car_insurance",carD[i].id);for(var i=0;i<ncD.length;i++)await apiD("noncar_insurance",ncD[i].id);msg("已清空全部数据");carSel={};ncSel={};await loadAll();}catch(e){msg("清空失败",1);}}
init();
</script>
